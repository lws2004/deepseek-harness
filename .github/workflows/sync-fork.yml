name: Sync fork with upstream

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 UTC 3 点（北京时间 11 点）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        run: |
          # 配置 git 用户信息
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 添加上游远程仓库（如果不存在）
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git 2>/dev/null || true
          git fetch upstream

          # 尝试快速前进合并
          if git merge --ff-only upstream/master; then
            echo "✅ 快速前进合并成功"
            git push origin master
          else
            echo "⚠️ 无法快速前进，尝试普通合并..."
            # 如果有冲突，需要人工解决
            if git merge upstream/master; then
              echo "✅ 合并成功"
              git push origin master
            else
              echo "❌ 合并冲突，需要人工解决"
              exit 1
            fi
          fi
